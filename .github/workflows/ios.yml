name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Analyze
        run: flutter analyze
        
      - name: Run tests
        run: flutter test
        
      - name: Build iOS
        run: |
          flutter build ipa --release \
            --obfuscate \
            --split-debug-info=build/ios/symbols
            
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-iOS
          path: build/ios/ipa/MyMusic.ipa
          retention-days: 7

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-iOS-symbols
          path: build/ios/symbols
          retention-days: 30