# MyMusic — pubspec.yaml PROPUESTO (fase arquitectura)
# NO es funcional todavía. No ejecutar `flutter pub get` hasta aprobación.
# Ver docs/04_PUBSPEC.md para justificación de cada dependencia.
name: mymusic
description: Reproductor musical privado desde la colección personal en Google Drive.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.0
  google_sign_in: ^6.2.1
  googleapis: ^11.3.0
  googleapis_auth: ^1.2.0
  http: ^1.2.1
  just_audio: ^0.9.35
  audio_service: ^0.18.12
  audioplayers: ^6.1.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.0.4
  uuid: ^4.4.0
  shared_preferences: ^2.0.0
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.0
  riverpod_test: ^0.1.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
